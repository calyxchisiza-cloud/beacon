[project]
name = "beacon"
version = "0.1.0"
description = "Feature flags and remote configuration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "redis>=5.2",
  "sentry-sdk>=2.19",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "locust>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "beacon_core*", "sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
